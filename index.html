<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para você, amor 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6EE;
    --blush:#F2E2DC;
    --rose:#8C3B4A;
    --rose-deep:#5E2230;
    --coral:#A8475A;
    --gold:#B08D57;
    --teal:#9C7B52;
    --ink:#3A2A2E;
    --ink-soft:#7E6A6E;
    --card:#FFFDFA;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{height:100%;}
  body{
    font-family:'Cormorant Garamond',Georgia,serif;
    color:var(--ink);
    background:linear-gradient(170deg,var(--cream) 0%,var(--blush) 60%,#EAD3CC 100%);
    background-attachment:fixed;
    overflow-x:hidden;
    line-height:1.7;
    font-size:1.08rem;
  }

  .wrap{max-width:520px;margin:0 auto;position:relative;}

  /* ambient floating hearts */
  #petals{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
  .petal{position:absolute;top:-40px;font-size:18px;opacity:.0;color:var(--rose);animation:fall linear forwards;}
  @keyframes fall{
    0%{transform:translateY(-40px) rotate(0deg);opacity:0;}
    10%{opacity:.85;}
    90%{opacity:.85;}
    100%{transform:translateY(110vh) rotate(360deg);opacity:0;}
  }

  /* ---------- GATE ---------- */
  #gate{
    position:fixed;inset:0;z-index:30;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;
    background:linear-gradient(170deg,#FBF6EE 0%,#F2E2DC 60%,#E7CFC8 100%);
    transition:opacity .9s ease,transform .9s ease;
  }
  #gate.gone{opacity:0;transform:scale(1.06);pointer-events:none;}
  .gate-eyebrow{
    font-family:'Pinyon Script',cursive;font-size:2.5rem;color:var(--rose);
    margin-bottom:10px;
  }
  .gate-title{
    font-family:'Fraunces',serif;font-weight:500;font-size:2.3rem;
    color:var(--rose-deep);line-height:1.18;margin-bottom:12px;letter-spacing:.3px;
  }
  .gate-sub{color:var(--ink-soft);font-size:1.12rem;font-style:italic;max-width:320px;margin-bottom:34px;}
  .envelope{
    width:128px;height:88px;position:relative;margin-bottom:30px;
    filter:drop-shadow(0 12px 22px rgba(178,58,91,.28));
    animation:bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .open-btn{
    font-family:'Fraunces',serif;font-weight:500;font-size:1.08rem;letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--cream);background:var(--rose-deep);
    border:1px solid var(--gold);border-radius:2px;padding:15px 42px;cursor:pointer;
    box-shadow:0 10px 24px rgba(94,34,48,.28);
    transition:transform .2s ease,box-shadow .2s ease,background .2s ease;
  }
  .open-btn:hover,.open-btn:focus-visible{transform:translateY(-2px);background:var(--rose);box-shadow:0 14px 30px rgba(94,34,48,.4);outline:none;}
  .open-btn:active{transform:scale(.96);}

  /* ---------- CONTENT ---------- */
  #story{position:relative;z-index:2;padding:0 22px 90px;}
  .section{
    min-height:auto;padding:64px 0 18px;
    opacity:0;transform:translateY(28px);
    transition:opacity .8s ease,transform .8s ease;
  }
  .section.show{opacity:1;transform:none;}

  .eyebrow{
    font-family:'Pinyon Script',cursive;font-size:2.2rem;color:var(--gold);
    display:inline-block;margin-bottom:2px;
  }
  h2{
    font-family:'Fraunces',serif;font-weight:500;font-size:2rem;
    color:var(--rose-deep);line-height:1.2;margin-bottom:14px;letter-spacing:.3px;
  }
  p.lead{font-size:1.18rem;color:var(--ink);}
  p.soft{color:var(--ink-soft);font-size:1.08rem;font-style:italic;}

  /* counter */
  .counter-card{
    background:var(--card);border-radius:8px;padding:32px 24px;
    box-shadow:0 16px 40px rgba(94,34,48,.12);text-align:center;
    border:1px solid var(--gold);
  }
  .count-big{
    font-family:'Fraunces',serif;font-weight:500;
    font-size:3.8rem;color:var(--rose);line-height:1;
    letter-spacing:-1px;
  }
  .count-label{font-size:1.1rem;color:var(--ink-soft);margin-top:6px;letter-spacing:1px;font-style:italic;}
  .count-fine{
    margin-top:16px;font-size:.98rem;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .count-fine b{color:var(--gold);font-weight:600;}

  /* clock tower block */
  .tower-block{text-align:center;}
  .tower-svg{width:96px;height:auto;margin:0 auto 18px;display:block;
    filter:drop-shadow(0 10px 18px rgba(66,48,58,.18));}
  .memory-card{
    background:linear-gradient(135deg,#FFFDFA,#F7EBE6);
    border-radius:8px;padding:28px 24px;margin-top:14px;
    box-shadow:0 14px 34px rgba(94,34,48,.1);
    border:1px solid rgba(176,141,87,.4);
  }

  /* love cards (flip) */
  .cards-hint{margin:6px 0 20px;font-family:'Pinyon Script',cursive;font-size:1.9rem;color:var(--gold);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .flip{
    perspective:900px;height:150px;cursor:pointer;
    background:none;border:none;padding:0;font-family:inherit;
  }
  .flip-inner{
    position:relative;width:100%;height:100%;
    transition:transform .6s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .flip.flipped .flip-inner{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;border-radius:8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:16px;backface-visibility:hidden;
    box-shadow:0 10px 26px rgba(94,34,48,.14);
  }
  .face .emoji{font-size:1.7rem;margin-bottom:8px;opacity:.92;}
  .face .ftitle{font-family:'Fraunces',serif;font-weight:500;font-size:1.25rem;letter-spacing:.3px;}
  .face-front{color:var(--cream);}
  .c1 .face-front{background:var(--rose);}
  .c2 .face-front{background:var(--gold);}
  .c3 .face-front{background:#7E5A66;}
  .c4 .face-front{background:var(--rose-deep);}
  .face-back{
    background:var(--card);transform:rotateY(180deg);
    color:var(--ink);font-size:1.12rem;line-height:1.5;
    border:1px solid rgba(176,141,87,.4);
  }
  .face-back b{color:var(--rose);font-weight:600;}

  /* final */
  #finale{text-align:center;padding-top:70px;}
  .final-btn{
    font-family:'Fraunces',serif;font-weight:500;font-size:1.02rem;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--rose-deep);
    background:var(--card);border:1px solid var(--gold);border-radius:2px;
    padding:14px 38px;cursor:pointer;box-shadow:0 10px 24px rgba(94,34,48,.16);
    transition:transform .2s ease,background .2s ease,color .2s ease;
  }
  .final-btn:hover,.final-btn:focus-visible{transform:translateY(-2px);background:var(--rose-deep);color:var(--cream);outline:none;}
  .final-btn:active{transform:scale(.96);}
  .te-amo{
    font-family:'Fraunces',serif;font-weight:500;font-style:italic;font-size:4.4rem;
    color:var(--rose);line-height:1;opacity:0;transform:scale(.6);
    margin:10px 0 6px;
    transition:opacity .7s ease,transform .7s cubic-bezier(.34,1.56,.64,1);
  }
  .te-amo.show{opacity:1;transform:scale(1);}
  .sign{
    font-family:'Pinyon Script',cursive;font-size:2.6rem;color:var(--ink-soft);
    opacity:0;transition:opacity .8s ease .3s;
  }
  .sign.show{opacity:1;}

  .hidden{display:none;}

  @media (prefers-reduced-motion: reduce){
    .petal,.envelope{animation:none;}
    .section{transition:none;opacity:1;transform:none;}
    .flip-inner,.te-amo,.sign,#gate{transition:none;}
  }

  /* ---------- PHOTOS ---------- */
  .photo-block{padding:34px 0 8px;}
  .photo-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .photo{
    position:relative;display:block;width:100%;padding:0;border:1px solid var(--gold);
    background:#2a1a22;border-radius:6px;overflow:hidden;cursor:pointer;
    box-shadow:0 14px 34px rgba(94,34,48,.18);aspect-ratio:3/4;font-family:inherit;
  }
  .photo img{
    width:100%;height:100%;object-fit:cover;display:block;
    filter:blur(16px) brightness(.62) sepia(.15);transform:scale(1.08);
    transition:filter .7s ease,transform .7s ease;
  }
  .photo.revealed img{filter:none;transform:scale(1);}
  .veil{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;
    color:var(--cream);font-family:'Pinyon Script',cursive;font-size:1.9rem;letter-spacing:.4px;
    background:rgba(94,34,48,.28);transition:opacity .5s ease;
  }
  .veil-i{font-size:1.6rem;}
  .photo.revealed .veil{opacity:0;pointer-events:none;}
  .cap{
    position:absolute;left:0;right:0;bottom:0;padding:22px 14px 14px;
    color:#fff;font-family:'Fraunces',serif;font-weight:400;font-style:italic;font-size:1.05rem;
    text-align:center;background:linear-gradient(transparent,rgba(40,16,22,.72));
    opacity:0;transform:translateY(10px);
    transition:opacity .5s ease .15s,transform .5s ease .15s;
  }
  .photo.revealed .cap{opacity:1;transform:none;}
  @media (prefers-reduced-motion: reduce){
    .photo img,.veil,.cap{transition:none;}
  }
</style>
</head>
